# Flight Price Monitor Configuration
# Monitoring Business Class fares from USA to Kenya for June 2027

origins:
  - JFK  # New York JFK (only US airport with nonstop service to Kenya)

destinations:
  - NBO  # Nairobi, Kenya

# Representative June 2027 departure dates (4 queries/day = ~25 days on SearchApi 100 free requests)
departure_dates:
  - "2027-06-08"
  - "2027-06-17"

# Trip lengths in days (10-18 day range)
trip_lengths_days:
  - 11
  - 16

cabin: BUSINESS
currency: USD
adults: 1
nonstop_only: true

# Alert thresholds
target_max_price_usd: 3500.0
drop_threshold_pct: 25.0
min_realert_drop_usd: 50.0  # Only re-alert on same route/dates if price drops another $50+

# Notification settings
send_daily_summary: true
send_instant_alerts: true

# API rate limiting
request_delay_seconds: 0.25
